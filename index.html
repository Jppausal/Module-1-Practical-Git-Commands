<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sample HTML Page</title>
</head>
<body>

  <!-- Main Heading -->
  <h1>Welcome to My Web Page</h1>
  <p>This is a simple paragraph with <strong>bold text</strong> and <em>italic text</em>.</p>

  <!-- Links and Images -->
  <h2>Useful Elements</h2>
  <p>Visit <a href="https://developer.mozilla.org/" target="_blank">MDN Web Docs</a> to learn more.</p>
  <img src="https://placeholder.com" alt="Placeholder image" width="300" height="150">

  <!-- Unordered List -->
  <h3>Key Features</h3>
  <ul>
    <li>Clean HTML5 structure</li>
    <li>Mobile-friendly viewport tag</li>
    <li>Semantic tags for readability</li>
  </ul>

  <!-- Simple Form -->
  <h3>Contact Form</h3>
  <form action="/submit" method="POST">
    <label for="name">Name:</label>
    <input type="text" id="name" name="name" required>
    <button type="submit">Send</button>
  </form>

</body>
</html>
